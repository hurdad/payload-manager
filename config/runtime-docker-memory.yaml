server:
  bind_address: "0.0.0.0:50051"

database:
  # In-memory catalog: no database container to run, and the stack is just
  # the service. Payload references do not survive a restart, so this is for
  # local work, demos and CI — runtime-docker-postgres.yaml is the same
  # deployment backed by PostgreSQL. Naming the backend matters: an absent
  # database block also selects memory, silently.
  memory: {}

storage:
  # A small ring so the ring tier is exercised by the examples stacks rather
  # than only described. Rings are static — created at startup from this list,
  # never over the API — so a consumer's MapRing only sees what is declared
  # here. 4 x 64 KiB is negligible against the RAM tier budget below, which is
  # reduced by whatever rings reserve.
  ring:
    rings:
      - ring_id: "example"
        n_slots: 4
        slot_size_bytes: 65536

  ram:
    capacity_bytes: 8589934592  # 8 GiB
    use_hugepages: false
    shm_prefix: "pm"  # POSIX shm segments named /pm-<uuid>
  disk:
    root_path: "/var/lib/payload-manager/payloads"
    capacity_bytes: 107374182400  # 100 GiB
    fsync: true

spill_workers:
  threads: 4
  retry_backoff: "1s"

leases:
  default_lease: "20s"
  max_lease: "120s"

logging:
  level: "warn"
  pattern: "%+"
  include_trace_context: false

observability:
  metrics_enabled: false
  tracing_enabled: false
  logs_enabled: false
