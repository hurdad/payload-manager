-dash)"/><line class="dash" x1="904" y1="433" x2="940" y2="433" stroke-dasharray="5 4" marker-end="url(#a-dash)"/><rect class="grp g4" x="628" y="614" width="506" height="86" rx="10"/><rect class="ring" x="652" y="642" width="458" height="44" rx="7"/><text class="lbl" x="881.0" y="662.0">N pre-allocated /dev/shm slots per ring</text><text class="sub" x="881.0" y="677.0">(ring_id, slot_idx, generation)  ·  no PayloadID  ·  no catalog row</text><line class="edge" x1="170" y1="84" x2="170" y2="94" marker-end="url(#a-edge)"/><line class="edge" x1="170" y1="134" x2="170" y2="196" marker-end="url(#a-edge)"/><text class="elbl" x="216" y="170">REST / JSON</text><line class="edge" x1="202" y1="242" x2="202" y2="266" marker-end="url(#a-edge)"/><line class="edge" x1="440" y1="84" x2="440" y2="266" marker-end="url(#a-edge)"/><text class="elbl" x="494" y="176">gRPC, direct</text><line class="edge" x1="177" y1="312" x2="177" y2="336" marker-end="url(#a-edge)"/><line class="edge" x1="442" y1="312" x2="442" y2="336" marker-end="url(#a-edge)"/><line class="edge" x1="177" y1="398" x2="177" y2="424" marker-end="url(#a-edge)"/><line class="edge" x1="140" y1="470" x2="118" y2="490" marker-end="url(#a-edge)"/><line class="edge" x1="215" y1="470" x2="240" y2="490" marker-end="url(#a-edge)"/><line class="edge" x1="177" y1="534" x2="177" y2="560" marker-end="url(#a-edge)"/><line class="thin" x1="302" y1="583" x2="628" y2="368" marker-end="url(#a-thin)"/><path class="thin" d="M442 398 V 657 H 628" marker-end="url(#a-thin)" fill="none"/><path class="data" d="M564 64 H 1215 V 657" fill="none"/><text class="dlbl" x="880" y="52">data plane  —  bytes move directly, no service in the path</text><line class="data" x1="1215" y1="338" x2="1134" y2="338" marker-end="url(#a-data)"/><line class="data" x1="1215" y1="657" x2="1134" y2="657" marker-end="url(#a-data)"/><rect class="lblbg" x="37" y="31" width="73.39999999999999" height="21" rx="4"/><text class="grpt g1t" x="44" y="46">Clients</text><rect cla