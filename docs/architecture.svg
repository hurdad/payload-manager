node" x="52" y="522" width="250" height="62" rx="7"/><text class="lbl" x="177.0" y="551.0">Placement · Tiering · Spill</text><text class="sub" x="177.0" y="566.0">demotes a tier under pressure</text><rect class="grp g3" x="628" y="126" width="506" height="430" rx="10"/><rect class="tier" x="668" y="166" width="236" height="50" rx="7"/><text class="lbl" x="786.0" y="189.0">GPU</text><text class="sub" x="786.0" y="204.0">CUDA IPC handle</text><rect class="tier" x="668" y="268" width="236" height="50" rx="7"/><text class="lbl" x="786.0" y="291.0">RAM</text><text class="sub" x="786.0" y="306.0">POSIX shared memory</text><rect class="tier" x="668" y="370" width="236" height="50" rx="7"/><text class="lbl" x="786.0" y="393.0">Disk</text><text class="sub" x="786.0" y="408.0">file</text><rect class="tier" x="668" y="472" width="236" height="50" rx="7"/><text class="lbl" x="786.0" y="495.0">Object storage</text><text class="sub" x="786.0" y="510.0">S3 / GCS / Azure</text><rect class="void" x="940" y="370" width="170" height="50" rx="7"/><text class="lbl" x="1025.0" y="393.0">Void</text><text class="sub" x="1025.0" y="408.0">deleted, not moved</text><line class="spill" x1="786" y1="216" x2="786" y2="268" marker-end="url(#a-spill)"/><text class="elbl" x="812" y="248">spill</text><line class="spill" x1="786" y1="318" x2="786" y2="370" marker-end="url(#a-spill)"/><text class="elbl" x="812" y="350">spill</text><line class="spill" x1="786" y1="420" x2="786" y2="472" marker-end="url(#a-spill)"/><text class="elbl" x="812" y="452">spill</text><line class="dash" x1="904" y1="191" x2="940" y2="380" stroke-dasharray="5 4" marker-end="url(#a-dash)"/><text class="elbl" x="1025" y="332">spill_target = TIER_VOID</text><line class="dash" x1="904" y1="293" x2="940" y2="388" stroke-dasharray="5 4" marker-end="url(#a-dash)"/><line class="dash" x1="904" y1="395" x2="940" y2="395" stroke-dasharray="5 4" marker-end="url(#a-dash)"/><rect class="grp g4" x="628" y="576" width="506" height="86" rx="10"