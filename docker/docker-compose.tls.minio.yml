# Client half of the TLS overlay: points object-spill-test at the CA and a token.
# Layer it after the overlay that defines object-spill-test, and after
# docker-compose.tls.yml which switches the server over.

services:
  object-spill-test:
    volumes:
      - ../certs:/certs:ro
    environment:
      PAYLOAD_MANAGER_TLS_CA: /certs/ca.pem
      PAYLOAD_MANAGER_TOKEN_FILE: /certs/dev-token.txt
