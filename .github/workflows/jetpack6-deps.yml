name: JetPack 6 deps images

# Publishes the dependency image pair that docker/Dockerfile.jetpack6 builds on:
# Abseil, re2, Protobuf, gRPC, OpenTelemetry, the AWS SDK, Arrow and libpqxx,
# compiled from source for aarch64. That takes hours on Jetson hardware and
# changes only when docker/Dockerfile.jetpack6-deps changes, which is why it is
# not a job in ci.yml — it has a different lifecycle from anything that runs
# per commit, and ci.yml's whole point is that every per-commit job lives there.
#
# Two safeguards keep this from running when it has nothing to do: the path
# filter below, and the existence check in the resolve step. The tag is derived
# from the contents of the Dockerfile, so an unchanged recipe resolves to a tag
# that is already in the registry and the build is skipped outright. That also
# makes a manual re-run cheap and makes old tags stay resolvable after a bump.

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.jetpack6-deps'
      - '.github/workflows/jetpack6-deps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/Dockerfile.jetpack6-deps'
      - '.github/workflows/jetpack6-deps.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the tag already exists'
        type: boolean
        default: false

# A newer dependency recipe supersedes an in-flight build of the old one: the
# tag it was producing is content-derived and nothing will reference it again.
# Left false, a second push would queue behind a build measured in hours.
concurrency:
  group: jetpack6-deps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deps:
    name: Build and publish
    # Native ARM64. Under QEMU this is a multi-day build, not a slow one.
    runs-on: [self-hosted, ARM64]
    # Hours of from-source compilation; the default 360 would cut it off.
    timeout-minutes: 720
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      exists: ${{ steps.resolve.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag and check whether it is already published
        id: resolve
        run: |
          set -euo pipefail
          tag="$(sha256sum docker/Dockerfile.jetpack6-deps | cut -c1-12)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "dev=ghcr.io/${{ github.repository }}-jetpack6-deps-dev:${tag}" >> "$GITHUB_OUTPUT"
          echo "runtime=ghcr.io/${{ github.repository }}-jetpack6-deps-runtime:${tag}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Forced rebuild of ${tag}."
          elif docker manifest inspect \
                 "ghcr.io/${{ github.repository }}-jetpack6-deps-runtime:${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${tag} is already published; nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${tag} is not published yet."
          fi

      # No buildx: the default driver is enough for a single-platform native
      # build, and setup-buildx-action's container driver would not reuse the
      # runner's local layer cache between runs.
      - name: Build dev image
        if: steps.resolve.outputs.exists != 'true'
        run: |
          docker build -f docker/Dockerfile.jetpack6-deps --target dev \
            --build-arg BUILD_JOBS=6 \
            -t "${{ steps.resolve.outputs.dev }}" .

      # Reuses every layer above; only the runtime base and the library copy run.
      - name: Build runtime image
        if: steps.resolve.outputs.exists != 'true'
        run: |
          docker build -f docker/Dockerfile.jetpack6-deps --target runtime \
            --build-arg BUILD_JOBS=6 \
            -t "${{ steps.resolve.outputs.runtime }}" .

      # latest moves, the content tag does not. docker/Dockerfile.jetpack6 defaults
      # to latest for humans; ci.yml passes the exact tag.
      - name: Push
        if: steps.resolve.outputs.exists != 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          dev="${{ steps.resolve.outputs.dev }}"
          runtime="${{ steps.resolve.outputs.runtime }}"
          docker tag "$dev" "ghcr.io/${{ github.repository }}-jetpack6-deps-dev:latest"
          docker tag "$runtime" "ghcr.io/${{ github.repository }}-jetpack6-deps-runtime:latest"
          docker push "$dev"
          docker push "$runtime"
          docker push "ghcr.io/${{ github.repository }}-jetpack6-deps-dev:latest"
          docker push "ghcr.io/${{ github.repository }}-jetpack6-deps-runtime:latest"

      - name: Summary
        run: |
          {
            echo "### Jetson dependency images"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${{ steps.resolve.outputs.tag }}\` |"
            echo "| Already published | ${{ steps.resolve.outputs.exists }} |"
            echo "| Dev | \`${{ steps.resolve.outputs.dev }}\` |"
            echo "| Runtime | \`${{ steps.resolve.outputs.runtime }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
