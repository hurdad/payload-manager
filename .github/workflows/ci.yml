  #
  # The 11 are real UI failures, not infrastructure:
  #   tests/pagination.spec.ts  9 cases — Next/Prev enablement, the X-Y of Z
  #                             count line, tier-filter reset, empty result
  #   tests/streams.spec.ts     2 cases — appending a payload ID, commit last
  #                             offset
  #
