name: CI

# One pipeline for everything: lint, generated-code drift, unit tests and
# coverage, the integration and end-to-end stacks, GPU tests, and the container
# images. This replaces quality.yml plus six near-identical docker-*.yml
# workflows that differed only in image name and Dockerfile.
#
# The images publish only after the test jobs pass. Previously they ran in
# parallel with the tests, so a red main still pushed to ghcr.
#
# Images are built once per architecture and joined into one tag afterwards:
# seven build jobs (four images on amd64, three of them again on arm64) push by
# digest, then four manifest jobs turn those digests into multi-arch tags. See
# docker/README.md for the shape and why it is not one QEMU job.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same ref makes the in-flight run redundant. Never cancel
# on main or on a tag: those runs publish images.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The container jobs run on an image whose /bin/sh is dash, and steps were
# getting it rather than bash. `mapfile` and `< <(process substitution)` are
# bash-only, so the clang-tidy step died with "Syntax error: redirection
# unexpected" before running a single check — in this workflow and in the one
# it replaced. clang-tidy had therefore never actually run in CI.
#
# Set it once here rather than per step, so the next thing written with an
# array or a heredoc does not rediscover this.
defaults:
  run:
    shell: bash

env:
  ARROW_VERSION: "25.0.1"

jobs:
  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install clang-format
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-format cmake git ca-certificates

      - uses: actions/checkout@v7

      - name: Check formatting
        run: |
          cmake -DCLANG_FORMAT_EXE="$(command -v clang-format)" \
                -DSOURCE_DIR="$PWD" -DCHECK=ON \
                -P cmake/RunClangFormat.cmake

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Bootstrap
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git wget

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-cpp-deps
        with:
          arrow-version: ${{ env.ARROW_VERSION }}
          extra-packages: clang-tidy clang-tools

      # clang-tidy needs compile_commands.json plus every generated header.
      - name: Configure and generate protos
        run: |
          cmake -S . -B build -G Ninja -DPAYLOAD_MANAGER_ENABLE_OTEL=ON -DBUILD_TESTING=ON
          cmake --build build --target generate_protos

      # Drive the file list from compile_commands.json rather than git, so we
      # only analyse translation units actually in this build configuration.
      # Analysing one that is not (e.g. the CUDA store when CUDA is off) makes
      # clang-tidy fall back to default flags and report spurious
      # "file not found" errors.
      - name: Run clang-tidy on our sources
        run: |
          mapfile -t files < <(python3 -c "
          import json
          keep = ('/internal/', '/client/cpp/', '/cmd/')
          seen = set()
          for e in json.load(open('build/compile_commands.json')):
              f = e['file']
              if any(k in f for k in keep) and '.pb.cc' not in f and f not in seen:
                  seen.add(f); print(f)
          ")
          printf 'Analysing %d translation units\n' "${#files[@]}"
          # -DFMT_CONSTEVAL= : spdlog's headers use fmt's consteval format-string
          # checking, which the clang frontend cannot constant-evaluate in code
          # compiled for GCC. Without this every TU including spdlog reports a
          # spurious clang-diagnostic-error.
          run-clang-tidy -p build -quiet -j"$(nproc)" \
            -extra-arg=-DFMT_CONSTEVAL= "${files[@]}"

  # ---------------------------------------------------------------------------
  # Generated code
  #
  # buf generate silently produced nothing for months after the proto roots
  # were consolidated, and nobody noticed because nothing checked. The Go
  # stubs simply froze. This job is the check that was missing.
  # ---------------------------------------------------------------------------

  generated:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      # scripts/codegen.sh owns every pinned version, including the Go toolchain
      # it reads out of gateway/go.mod. Running it here rather than repeating
      # the versions means CI and a developer's machine cannot disagree about
      # what "regenerated" means — which they did: the same plugin built under
      # a different Go rewrote 154 lines of comments and failed this check.
      - name: Regenerate Go stubs
        run: scripts/codegen.sh go

      # Checks untracked files too: `git diff` alone only sees modifications to
      # tracked files, so a brand-new generated file — exactly what appears
      # when a proto is added — would slip through silently.
      - name: Fail if the committed stubs are stale
        run: |
          set -uo pipefail
          changed=$(git status --porcelain -- gateway/gen gateway/openapi)
          if [ -n "$changed" ]; then
            echo "::error::Generated Go stubs are out of date. Run 'buf generate' and commit the result."
            echo "--- changed or untracked ---"
            echo "$changed"
            echo "--- diff of tracked files ---"
            git --no-pager diff --stat -- gateway/gen gateway/openapi
            git --no-pager diff -- gateway/gen gateway/openapi | head -400
            exit 1
          fi
          echo "generated stubs match the protos"

      - name: Gateway builds, vets and tests
        run: |
          set -euo pipefail
          # main.go embeds ./static, which is produced by the UI build. The
          # image build does that; here a placeholder is enough to compile.
          mkdir -p gateway/static && echo '<!doctype html>' > gateway/static/index.html
          cd gateway
          go build ./...
          # ./... not ./gen/... — this used to vet only the generated stubs,
          # which is the code least likely to be wrong, and skipped main.go and
          # middleware/ entirely. Those are the hand-written parts: the CORS
          # allow list, the UUID path rewrite, the download handler.
          go vet ./...
          # gofmt on the hand-written files only; the generated tree is the
          # code generator's business.
          unformatted=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            gofmt -d $unformatted
            exit 1
          fi
          go test ./middleware/...

  # ---------------------------------------------------------------------------
  # Build, unit tests, coverage, repository parity
  # ---------------------------------------------------------------------------

  build-test:
    name: Build, unit tests and coverage
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      # The RAM and ring tiers allocate POSIX shm; the default 64 MB is too
      # small for the tier-accounting and ring suites.
      options: --shm-size=1g
    env:
      # Dependabot-triggered pull_request runs get a read-only GITHUB_TOKEN and
      # no access to Actions secrets — those live in a separate Dependabot
      # secret store — so secrets.CODECOV_TOKEN expands to "". Codecov then
      # falls back to a tokenless upload, which a protected branch rejects with
      # "Token required because branch is protected", and fail_ci_if_error
      # turned that into a red build on every Dependabot PR. Fork PRs have the
      # same problem. A coverage upload should not be able to fail a build
      # whose tests passed, so the upload steps below skip when no token
      # exists. `secrets` cannot be read from a step-level `if`, hence the
      # job-level env indirection.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    services:
      # Only the repository parity suite uses this. Everything else is
      # in-process against the in-memory repository.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_manager
        options: >-
          --health-cmd "pg_isready -U payload -d payload_manager"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Bootstrap
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git wget

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-cpp-deps
        with:
          arrow-version: ${{ env.ARROW_VERSION }}
          extra-packages: gcovr python3-pip

      # The Python stub check below compares committed output byte for byte,
      # so the generator has to be pinned. Left to whatever grpcio-tools the
      # runner happens to carry, the check would report the toolchain moving
      # rather than the schema. This pin is what produced the committed stubs
      # and dictates the floors in client/python/setup.py — the three move
      # together.
      #
      # --break-system-packages because Ubuntu marks its interpreter
      # externally managed; the container is thrown away after the job, and
      # installing into it is what lets CMake's own Python3 detection find
      # grpc_tools without a second interpreter to keep in step.
      - name: Pin the Python proto toolchain
        run: pip3 install --break-system-packages --quiet "grpcio-tools==1.75.1"

      # PAYLOAD_MANAGER_ENABLE_PYTHON_PROTO=ON rather than relying on
      # autodetection: without it a missing toolchain silently drops the
      # sync_python_client target, and the check below fails as "no rule to
      # make target" instead of saying what is actually wrong.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DPAYLOAD_MANAGER_ENABLE_COVERAGE=ON \
            -DPAYLOAD_MANAGER_ENABLE_OTEL=ON \
            -DPAYLOAD_MANAGER_ENABLE_PYTHON_PROTO=ON \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      # Integration suites need the live stacks and run in their own jobs, so
      # a missing service here cannot look like a test failure.
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -E "integration" --output-junit test-results.xml

      # Parity is the one integration suite that needs nothing but a database,
      # and it creates its own schema.
      - name: Repository parity against Postgres
        env:
          PAYLOAD_TEST_POSTGRES_URI: "postgresql://payload:payload@postgres:5432/payload_manager"
        run: ctest --test-dir build --output-on-failure -L parity

      # The committed Python stubs are generated from these protos. Same
      # reasoning as the Go check above.
      - name: Fail if the committed Python stubs are stale
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          # Via the script so its grpcio-tools check runs here too: a version
          # other than the pinned one fails saying so, rather than quietly
          # regenerating different output and reporting it as schema drift.
          scripts/codegen.sh python
          changed=$(git status --porcelain -- client/python)
          if [ -n "$changed" ]; then
            echo "::error::Committed Python stubs are out of date. Run the sync_python_client target and commit the result."
            echo "--- toolchain ---"
            python3 -c "import importlib.metadata as m,sys; print('python', sys.version.split()[0]); print('grpcio-tools', m.version('grpcio-tools')); print('protobuf', m.version('protobuf'))"
            echo "--- changed or untracked ---"
            echo "$changed"
            echo "--- diff ---"
            git --no-pager diff --stat -- client/python
            git --no-pager diff -- client/python | head -200
            exit 1
          fi
          echo "committed Python stubs match the protos"

      # Runs even when the suite failed — a red run is exactly when the
      # per-test breakdown is worth having.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/test-results.xml

      # `build` is passed explicitly rather than relying on gcovr searching
      # from the working directory: with no search path a build tree it cannot
      # find yields a perfectly valid report measuring nothing, which uploads
      # cleanly and silently drops the project status to 0%. The guard turns
      # that into a failure instead.
      # `!cancelled()` for the same reason the test-results upload has it: a
      # failing suite is exactly when the coverage delta is worth seeing, and
      # the first CI run lost coverage entirely because one new test step
      # failed ahead of these and skipped them.
      - name: Generate coverage report
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Patterns are anchored '(.*/)?' rather than '.*/': gcovr matches these
          # against paths relative to --root, so a leading '.*/' never matched
          # 'tests/...' or 'examples/...' and both were counted. Test sources
          # execute themselves, so they scored ~76% and pulled the reported
          # figure well above the truth — 68.8% against 59.5% for shipping code.
          # These now mirror codecov.yml's ignore list, so the summary here and
          # the number Codecov reports are the same number.
          gcovr --root . build \
            --exclude '(.*/)?build/.*' \
            --exclude '(.*/)?cmake-build-[^/]*/.*' \
            --exclude '(.*/)?tests/.*' \
            --exclude '(.*/)?examples/.*' \
            --exclude '(.*/)?gateway/.*' \
            --exclude '(.*/)?ui/.*' \
            --exclude '.*\.pb\.(h|cc)$' \
            --exclude '.*\.grpc\.pb\.(h|cc)$' \
            --exclude '(.*/)?proto/google/.*' \
            --xml-pretty --output coverage.xml \
            --print-summary

          lines=$(python3 -c "
          import xml.etree.ElementTree as ET
          r = ET.parse('coverage.xml').getroot()
          print(sum(len(c.findall('lines/line')) for c in r.findall('.//class')))
          ")
          echo "coverage.xml describes $lines lines"
          if [ "$lines" -eq 0 ]; then
            echo "::error::Coverage report is empty — gcovr found no .gcda data. Refusing to upload 0%."
            exit 1
          fi

      # A silent skip would hide a genuinely missing secret on a normal run, so
      # say so. This is a notice rather than an error precisely because the
      # Dependabot and fork cases are expected, not broken.
      - name: Note skipped Codecov upload
        if: ${{ !cancelled() && env.HAS_CODECOV_TOKEN != 'true' }}
        run: |
          echo "::notice::CODECOV_TOKEN is not available to this run (Dependabot or fork PR); skipping both Codecov uploads. Coverage was still generated and checked non-empty above."

      - name: Upload to Codecov
        if: ${{ !cancelled() && env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  # ---------------------------------------------------------------------------
  # Python client
  # ---------------------------------------------------------------------------

  python:
    name: Python client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Installs the floors setup.py declares, which are the ones the
      # committed stubs actually require.
      - name: Install the client
        run: pip install ./client/python

      - name: Run tests
        run: python -m unittest discover -s tests/unit/python -p '*_test.py' -v

  # ---------------------------------------------------------------------------
  # Live stacks
  #
  # These use the repository's own compose overlays rather than reimplementing
  # them here. The API and object-spill suites skip silently when their
  # environment is unset, so running them without the stack would be a false
  # green — the compose files are what guarantee the services are really there.
  # ---------------------------------------------------------------------------

  integration-api:
    name: Integration (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `--exit-code-from` reports 0 when the named container never starts,
      # so a stack that dies on a dependency looks like a pass with no tests
      # run. Observed exactly that: payload-manager exited 2, the test
      # container produced no output, and compose still returned 0. Assert the
      # container actually ran and record its real exit status.
      - name: Run the API integration suite
        run: |
          set -euo pipefail
          COMPOSE=(docker compose
            -f docker/docker-compose.postgres.yml
            -f docker/docker-compose.test.yml)

          "${COMPOSE[@]}" up --build --abort-on-container-exit --exit-code-from integration-test || true

          cid=$("${COMPOSE[@]}" ps -a -q integration-test)
          if [ -z "$cid" ]; then
            echo "::error::integration-test container was never created — the stack failed to come up."
            exit 1
          fi
          status=$(docker inspect -f '{{.State.Status}}:{{.State.ExitCode}}' "$cid")
          echo "integration-test => $status"
          case "$status" in
            exited:0) echo "integration suite passed" ;;
            *) echo "::error::integration-test did not pass (state $status)"; exit 1 ;;
          esac

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.postgres.yml -f docker/docker-compose.test.yml logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.postgres.yml \
            -f docker/docker-compose.test.yml \
            down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # Object tier (MinIO)
  #
  # Was disabled while TIER_OBJECT spill failed outright: nothing created the
  # bucket, so every upload died with NO_SUCH_BUCKET. Re-enabled now that
  # ObjectArrowStore creates its root at construction.
  # ---------------------------------------------------------------------------
  # Same suite as integration-api, with TLS and bearer-token authentication
  # switched on. It exists because an untested secure path is a broken secure
  # path by the third refactor: everything here is opt-in, so without this job
  # the entire TLS and auth surface would be exercised by nothing.
  integration-api-tls:
    name: Integration (API over TLS + auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The credentials are gitignored and are not in any image, so they have
      # to be made before the stack comes up.
      - name: Generate development credentials
        run: scripts/gen-dev-certs.sh

      - name: Run the API integration suite over TLS
        run: |
          set -euo pipefail
          COMPOSE=(docker compose
            -f docker/docker-compose.postgres.yml
            -f docker/docker-compose.tls.yml
            -f docker/docker-compose.test.yml
            -f docker/docker-compose.tls.test.yml)

          "${COMPOSE[@]}" up --build --abort-on-container-exit --exit-code-from integration-test || true

          # Same false-green guard as the plaintext suite: --exit-code-from
          # reports 0 when the named container never starts.
          cid=$("${COMPOSE[@]}" ps -a -q integration-test)
          if [ -z "$cid" ]; then
            echo "::error::integration-test container was never created — the stack failed to come up."
            exit 1
          fi
          status=$(docker inspect -f '{{.State.Status}}:{{.State.ExitCode}}' "$cid")
          echo "integration-test (TLS) => $status"
          case "$status" in
            exited:0) ;;
            *) echo "::error::integration-test did not pass over TLS (state $status)"; exit 1 ;;
          esac

          # A pass proves the client reached the server, but not that the
          # server would have refused an unauthenticated one — a stack that
          # quietly fell back to plaintext would also pass. Assert the server
          # actually enabled both.
          server=$("${COMPOSE[@]}" ps -a -q payload-manager)
          if ! docker logs "$server" 2>&1 | grep -q 'tls=true auth=true'; then
            echo "::error::payload-manager did not start with TLS and auth enabled; the suite passed against a plaintext server."
            docker logs "$server" 2>&1 | tail -20
            exit 1
          fi
          echo "verified: the suite passed against a TLS server requiring tokens"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker/docker-compose.postgres.yml \
            -f docker/docker-compose.tls.yml \
            -f docker/docker-compose.test.yml \
            -f docker/docker-compose.tls.test.yml \
            logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.postgres.yml \
            -f docker/docker-compose.tls.yml \
            -f docker/docker-compose.test.yml \
            -f docker/docker-compose.tls.test.yml \
            down -v --remove-orphans

  integration-object:
    name: Integration (object tier / MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same false-green guard as the API suite above.
      - name: Run the object-spill suite
        run: |
          set -euo pipefail
          COMPOSE=(docker compose
            -f docker/docker-compose.postgres.yml
            -f docker/docker-compose.minio.yml
            -f docker/docker-compose.minio.test.yml)

          "${COMPOSE[@]}" up --build --abort-on-container-exit --exit-code-from object-spill-test || true

          cid=$("${COMPOSE[@]}" ps -a -q object-spill-test)
          if [ -z "$cid" ]; then
            echo "::error::object-spill-test container was never created — the stack failed to come up."
            exit 1
          fi
          status=$(docker inspect -f '{{.State.Status}}:{{.State.ExitCode}}' "$cid")
          echo "object-spill-test => $status"
          case "$status" in
            exited:0) echo "object-spill suite passed" ;;
            *) echo "::error::object-spill-test did not pass (state $status)"; exit 1 ;;
          esac

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker/docker-compose.postgres.yml \
            -f docker/docker-compose.minio.yml \
            -f docker/docker-compose.minio.test.yml \
            logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.postgres.yml \
            -f docker/docker-compose.minio.yml \
            -f docker/docker-compose.minio.test.yml \
            down -v --remove-orphans


  gpu:
    name: GPU tests
    # Self-hosted runner with an NVIDIA device. Needs Docker and the NVIDIA
    # Container Toolkit; the CUDA toolkit itself comes from the image.
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v7

      # Docker build has no GPU access — there is no --gpus for build — so the
      # image links against the libcuda stub and its in-build ctest skips every
      # GPU case. Build the builder stage (which keeps the test binaries) and
      # run the gpu-labelled suites against a real device.
      # This build is uncached and multi-GB, and the runner is long-lived. Show
      # what is left before starting, so "no space left on device" 25 minutes in
      # is diagnosable from the log rather than only from the box.
      #
      # Bytes are not the only way to get ENOSPC, and a run that failed with it
      # left no trace on the host afterwards, so capture all three candidates:
      # free space, free inodes, and the container's /dev/shm. Docker defaults
      # shm to 64 MB, and the builder stage runs ctest inside the build — a ring
      # test allocating a POSIX shm segment larger than that fails with exactly
      # "no space left on device" while the host disk sits idle.
      - name: Capacity before build
        run: |
          echo "--- free space ---"
          df -h / /var/lib/docker 2>/dev/null | sort -u
          echo "--- free inodes ---"
          df -i / /var/lib/docker 2>/dev/null | sort -u
          echo "--- docker ---"
          docker system df
          echo "--- container /dev/shm default ---"
          docker run --rm --entrypoint df ubuntu:26.04 -h /dev/shm 2>&1 || true

      - name: Build the CUDA builder stage
        run: docker build --target builder -t pm:cuda-builder -f docker/Dockerfile.cuda .

      # Separated from the tests so "no usable device" cannot masquerade as a
      # CUDA failure. The image asks only for compute,utility capabilities, so
      # a mount error naming a graphics library (libnvidia-egl-gbm, libnvidia-gl,
      # libEGL_nvidia) is the host's device spec, not anything in this repo:
      # the toolkit pins absolute versioned paths, and a driver or
      # libnvidia-egl-gbm1 upgrade leaves them pointing at files that no longer
      # exist. Regenerating the spec is what fixes it, and it needs doing after
      # every driver upgrade.
      - name: Confirm a device is visible
        run: |
          if ! docker run --rm --gpus all pm:cuda-builder nvidia-smi \
                 --query-gpu=name,driver_version,compute_cap --format=csv; then
            echo "::error::No usable GPU. If the failure above is a mount error naming a driver library, the host's NVIDIA device spec is stale — on the runner: sudo ldconfig && sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml && sudo systemctl restart docker"
            echo "--- host driver libraries the toolkit would mount ---"
            ls -l /usr/lib/x86_64-linux-gnu/libnvidia-egl-gbm.so* 2>&1 || true
            nvidia-smi --query-gpu=name,driver_version --format=csv 2>&1 || true
            nvidia-ctk cdi list 2>&1 | head -20 || true
            exit 1
          fi

      # CUDA 13 requires a Turing-or-newer device (sm_75+) and an r580+ driver;
      # a mismatch shows up here rather than as a confusing test failure.
      - name: Run GPU tests
        run: |
          docker run --rm --gpus all -v "$PWD:/out" pm:cuda-builder \
            ctest --test-dir /workspace/build -L gpu --output-on-failure \
                  --output-junit /out/gpu-test-results.xml

      - name: Upload GPU test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gpu-test-results.xml

      # Every run retags pm:cuda-builder, which leaves the previous image
      # dangling, and nothing here uses a registry cache that would bound the
      # growth. Unreclaimed, this filled the runner's disk and the build failed
      # 25 minutes in with "no space left on device".
      #
      # Scoped deliberately: this runner is not necessarily exclusive to this
      # repository. `docker image prune` without -a removes only dangling
      # layers, never a tagged image something else may depend on, and the
      # builder cache is capped rather than emptied so the next run still starts
      # warm. A blanket `docker system prune -af` would be the wrong tool.
      - name: Reclaim disk space
        if: ${{ always() }}
        run: |
          docker rmi -f pm:cuda-builder 2>/dev/null || true
          docker image prune -f
          docker builder prune -f --keep-storage=10GB || docker builder prune -f
          df -h / /var/lib/docker 2>/dev/null | sort -u
  # ---------------------------------------------------------------------------
  # Images
  #
  # One matrix in place of six copy-pasted workflows. Gated on the test jobs,
  # so a red main no longer publishes to ghcr.
  #
  # Each architecture is built on its own runner and pushed *by digest* only —
  # no tag. The manifest job below then joins the digests into one multi-arch
  # tag, so `docker pull ghcr.io/hurdad/payload-manager` resolves to amd64 or
  # arm64 by itself. The alternative, one job emitting both platforms through
  # QEMU, emulates an entire C++ build and takes hours; arm64 here is a native
  # build on the self-hosted board.
  #
  # cuda is amd64 only, and deliberately. The only arm64 target is a Jetson,
  # where the GPU tier cannot work: CUDA IPC is unsupported on Tegra, and it
  # fails one-sided — cudaIpcGetMemHandle succeeds while the consumer's
  # cudaIpcOpenMemHandle returns cudaErrorInvalidValue. Measured on an Orin.
  # ---------------------------------------------------------------------------

  images:
    name: Image (${{ matrix.name }}/${{ matrix.arch }})
    # Every test job that runs on GitHub-hosted runners gates publishing.
    #
    # `gpu` is deliberately not in this list. It runs on the self-hosted board,
    # whose availability is not a property of the change being tested: a runner
    # that is offline, or whose NVIDIA device spec went stale after a driver
    # upgrade, would otherwise block every image including the three that have
    # nothing to do with CUDA. The tradeoff is explicit — the -cuda image can
    # publish while the GPU suite is red, so check that job before trusting a
    # -cuda tag.
    needs: [format, tidy, generated, build-test, python, integration-api, integration-api-tls, integration-object]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: payload-manager
            file: docker/Dockerfile
            suffix: ""
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: cuda
            file: docker/Dockerfile.cuda
            suffix: "-cuda"
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: payloadctl
            file: docker/Dockerfile.payloadctl
            suffix: "-payloadctl"
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: gateway
            file: docker/Dockerfile.gateway
            suffix: "-gateway"
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest

          # Native arm64 on the self-hosted board. No cuda entry — see above.
          # docker/Dockerfile runs ctest in its
          # builder stages, so these also give the suite a native arm64 run,
          # which nothing else in this pipeline does.
          - name: payload-manager
            file: docker/Dockerfile
            suffix: ""
            arch: arm64
            platform: linux/arm64
            runner: [self-hosted, ARM64]
          - name: payloadctl
            file: docker/Dockerfile.payloadctl
            suffix: "-payloadctl"
            arch: arm64
            platform: linux/arm64
            runner: [self-hosted, ARM64]
          - name: gateway
            file: docker/Dockerfile.gateway
            suffix: "-gateway"
            arch: arm64
            platform: linux/arm64
            runner: [self-hosted, ARM64]
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v7

      # No QEMU: every entry above builds its own architecture natively.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. Tags belong to the manifest, not to a single-arch build.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      # On a pull request nothing is pushed, so there is no digest to join and
      # the build is validation only.
      - name: Build (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      # The filename is the digest; the file itself is empty. The manifest job
      # only needs the names.
      #
      # runner.temp, wiped first, rather than a fixed /tmp path. A hosted runner
      # is a fresh VM per job so either works there, but the arm64 half of this
      # matrix runs on one long-lived self-hosted board where /tmp persists
      # between jobs. A shared directory there accumulates: the second image to
      # build uploads its own digest plus the first one's, the third uploads
      # three, and the manifest job then asks imagetools to join a digest that
      # was pushed to a different repository, which fails as "not found".
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          rm -rf "${{ runner.temp }}/digests"
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          test -n "$digest"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
          # One build, one digest. Anything else means the directory was dirty.
          n=$(find "${{ runner.temp }}/digests" -maxdepth 1 -type f | wc -l)
          test "$n" -eq 1 || { echo "::error::expected 1 digest, found $n"; exit 1; }

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Manifests
  #
  # Joins each image's per-architecture digests into one tag. This is the job
  # that makes `docker pull ghcr.io/hurdad/payload-manager` work on both an x86
  # server and a Jetson without the caller choosing an architecture.
  #
  # cuda passes through with a single digest, which is still a manifest list —
  # just one with one entry, so the tag shape stays identical across images.
  # ---------------------------------------------------------------------------

  manifest:
    name: Manifest (${{ matrix.name }})
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: payload-manager
            suffix: ""
          - name: cuda
            suffix: "-cuda"
          - name: payloadctl
            suffix: "-payloadctl"
          - name: gateway
            suffix: "-gateway"
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest was missing entirely before this pipeline existed, so
      # `docker pull ghcr.io/<repo>` — the implicit :latest every doc example
      # uses — did not resolve.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          # Without this the glob below stays literal and imagetools reports a
          # malformed reference rather than the real problem, which is that no
          # build uploaded a digest.
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no digests downloaded for ${IMAGE} — every build job for it must have failed"
            exit 1
          fi
          ls -1 | sed 's/^/  digest: /'
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
