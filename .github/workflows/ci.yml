  # ---------------------------------------------------------------------------
  # GPU
  # ---------------------------------------------------------------------------

  gpu:
    name: GPU tests
    # Self-hosted runner with an NVIDIA device. Needs Docker and the NVIDIA
    # Container Toolkit; the CUDA toolkit itself comes from the image.
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4

      # Docker build has no GPU access — there is no --gpus for build — so the
      # image links against the libcuda stub and its in-build ctest skips every
      # GPU case. Build the builder stage (which keeps the test binaries) and
      # run the gpu-labelled suites against a real device.
      - name: Build the CUDA builder stage
        run: docker build --target builder -t pm:cuda-builder -f docker/Dockerfile.cuda .

      - name: Confirm a device is visible
        run: |
          docker run --rm --gpus all pm:cuda-builder nvidia-smi \
            --query-gpu=name,driver_version,compute_cap --format=csv

      # CUDA 13 requires a Turing-or-newer device (sm_75+) and an r580+ driver;
      # a mismatch shows up here rather than as a confusing test failure.
      - name: Run GPU tests
        run: |
          docker run --rm --gpus all -v "$PWD:/out" pm:cuda-builder \
            ctest --test-dir /workspace/build -L gpu --output-on-failure \
                  --output-junit /out/gpu-test-results.xml

      - name: Upload GPU test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gpu-test-results.xml

  # ---------------------------------------------------------------------------
  # Images
  #
  # One matrix in place of six copy-pasted workflows. Gated on the test jobs,
  # so a red main no longer publishes to ghcr.
  # ---------------------------------------------------------------------------

  images:
    name: Image (${{ matrix.name }})
    # integration-object is absent deliberately — see the commented block above.
    needs: [format, tidy, generated, build-test, python, integration-api]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: payload-manager
            file: docker/Dockerfile
            suffix: ""
            runner: ubuntu-latest
            platforms: linux/amd64
            qemu: true
          - name: otel
            file: docker/Dockerfile.otel
            suffix: "-otel"
            runner: ubuntu-latest
            platforms: linux/amd64
            qemu: true
          - name: cuda
            file: docker/Dockerfile.cuda
            suffix: "-cuda"
            runner: ubuntu-latest
            platforms: linux/amd64
            qemu: true
          - name: payloadctl
            file: docker/Dockerfile.payloadctl
            suffix: "-payloadctl"
            runner: ubuntu-latest
            platforms: linux/amd64
            qemu: true
          - name: gateway
            file: docker/Dockerfile.gateway
            suffix: "-gateway"
            runner: ubuntu-latest
            platforms: linux/amd64
            qemu: true
          # Jetson is disabled for now. It builds natively on the ARM64
          # self-hosted runner, so it needs no QEMU and no cross platform
          # argument — uncomment this entry to bring it back. The ARM64 label
          # is still declared in .github/actionlint.yaml for that.
          # - name: jetson
          #   file: docker/Dockerfile.jetson
          #   suffix: "-jetson"
          #   runner: [self-hosted, ARM64]
          #   platforms: ""
          #   qemu: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          # latest was missing entirely, so `docker pull ghcr.io/<repo>` —
          # the implicit :latest that every doc example uses — did not resolve.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
