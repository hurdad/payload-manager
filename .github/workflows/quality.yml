name: Quality – build, test, coverage, lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# GitHub's ubuntu-latest runner is 24.04, which has neither
# opentelemetry-cpp-dev nor a new enough libarrow-dev. Every job therefore runs
# in an ubuntu:26.04 container, which is also exactly what the images target.
env:
  ARROW_VERSION: "25.0.1"
  APT_BUILD_DEPS: >-
    build-essential cmake ninja-build pkg-config git ca-certificates
    protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev libgrpc-dev
    libyaml-cpp-dev libpqxx-dev libpq-dev libspdlog-dev libcurl4-openssl-dev
    libssl-dev zlib1g-dev liblz4-dev libzstd-dev libsnappy-dev libbrotli-dev libbz2-dev
    libre2-dev libutf8proc-dev libxml2-dev libgtest-dev
    opentelemetry-cpp-dev

jobs:
  coverage:
    name: Build, test and upload coverage
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      # Runs before checkout so the container has git for actions/checkout.
      - name: Install build dependencies
        run: |
          sed -i 's/^Components: main$/Components: main universe/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates wget
          # Ubuntu universe's libarrow-dev is built ARROW_S3=OFF, which cannot
          # link the object tier or the client. Use the Apache repo.
          wget -q -O /tmp/arrow-apt-source.deb \
            https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-resolute.deb
          DEBIAN_FRONTEND=noninteractive apt-get install -y -V /tmp/arrow-apt-source.deb
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ${{ env.APT_BUILD_DEPS }} gcovr "libarrow-dev=${{ env.ARROW_VERSION }}-1"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DPAYLOAD_MANAGER_ENABLE_COVERAGE=ON \
            -DPAYLOAD_MANAGER_ENABLE_OTEL=ON \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      # Integration suites need live Postgres/MinIO; excluded from the
      # coverage lane so a missing service cannot look like a test failure.
      # --output-junit gives Codecov's test-results action something to parse.
      - name: Test
        run: ctest --test-dir build --output-on-failure -E "integration" --output-junit test-results.xml

      # Runs even when the suite failed — a red run is exactly when the
      # per-test breakdown is worth having.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/test-results.xml

      - name: Generate coverage report
        run: |
          gcovr --root . \
            --exclude '.*/build/.*' \
            --exclude '.*/tests/.*' \
            --exclude '.*\.pb\.(h|cc)$' \
            --exclude '.*/api/third_party/.*' \
            --xml-pretty --output coverage.xml \
            --print-summary

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install clang-format
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-format cmake git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting
        run: |
          cmake \
            -DCLANG_FORMAT_EXE="$(command -v clang-format)" \
            -DSOURCE_DIR="$PWD" \
            -DCHECK=ON \
            -P cmake/RunClangFormat.cmake

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          sed -i 's/^Components: main$/Components: main universe/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates wget
          wget -q -O /tmp/arrow-apt-source.deb \
            https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-resolute.deb
          DEBIAN_FRONTEND=noninteractive apt-get install -y -V /tmp/arrow-apt-source.deb
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ${{ env.APT_BUILD_DEPS }} clang-tidy clang-tools "libarrow-dev=${{ env.ARROW_VERSION }}-1"

      - name: Checkout
        uses: actions/checkout@v4

      # clang-tidy needs compile_commands.json plus every generated header.
      # There are two codegen targets: generate_protos for the api/ protos and
      # payload_manager_internal_config_proto for internal/config/*.proto.
      - name: Configure and generate protos
        run: |
          cmake -S . -B build -G Ninja -DPAYLOAD_MANAGER_ENABLE_OTEL=ON -DBUILD_TESTING=ON
          cmake --build build --target generate_protos
          cmake --build build --target payload_manager_internal_config_proto

      # Drive the file list from compile_commands.json rather than git, so we
      # only analyse translation units that are actually in this build
      # configuration. Analysing a file that is not (e.g. the CUDA store when
      # CUDA is off) makes clang-tidy fall back to default flags and report
      # spurious "file not found" errors.
      - name: Run clang-tidy on our sources
        run: |
          mapfile -t files < <(python3 -c "
          import json
          keep = ('/internal/', '/client/cpp/', '/cmd/')
          seen = set()
          for e in json.load(open('build/compile_commands.json')):
              f = e['file']
              if any(k in f for k in keep) and '.pb.cc' not in f and f not in seen:
                  seen.add(f); print(f)
          ")
          printf 'Analysing %d translation units\n' "${#files[@]}"
          # -DFMT_CONSTEVAL= : spdlog's headers use fmt's consteval format-string
          # checking, which the clang frontend cannot constant-evaluate in code
          # compiled for GCC. Without this every TU including spdlog reports a
          # spurious clang-diagnostic-error.
          # run-clang-tidy parallelises; the serial form takes over 10 minutes.
          run-clang-tidy -p build -quiet -j"$(nproc)" \
            -extra-arg=-DFMT_CONSTEVAL= \
            "${files[@]}"

  gpu:
    name: GPU tests
    # Self-hosted runner with an NVIDIA device. Needs Docker and the NVIDIA
    # Container Toolkit; the CUDA toolkit itself comes from the image.
    runs-on: [self-hosted, gpu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker build has no GPU access — there is no --gpus for build — so the
      # image links against the libcuda stub and its in-build ctest skips every
      # GPU case. Build the builder stage (which keeps the test binaries) and
      # run the gpu-labelled suites against a real device.
      - name: Build the CUDA builder stage
        run: |
          docker build --target builder \
            -t pm:cuda-builder \
            -f docker/Dockerfile.cuda .

      - name: Confirm a device is visible
        run: |
          docker run --rm --gpus all pm:cuda-builder nvidia-smi \
            --query-gpu=name,driver_version,compute_cap --format=csv

      # CUDA 13 requires a Turing-or-newer device (sm_75+) and an r580+ driver;
      # a mismatch shows up here rather than as a confusing test failure.
      # --output-junit writes to an absolute path inside the mounted directory,
      # so the report survives the container being removed.
      - name: Run GPU tests
        run: |
          docker run --rm --gpus all -v "$PWD:/out" pm:cuda-builder \
            ctest --test-dir /workspace/build -L gpu --output-on-failure \
                  --output-junit /out/gpu-test-results.xml

      - name: Upload GPU test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gpu-test-results.xml
