syntax = "proto3";

package payload.runtime.config;

// ------------------------------------------------------------
// Observability
// ------------------------------------------------------------

// OTLP transport selection
enum OtlpTransport {
  OTLP_TRANSPORT_UNSPECIFIED = 0; // Runtime default (gRPC)
  OTLP_TRANSPORT_GRPC = 1;        // OTLP over gRPC
  OTLP_TRANSPORT_HTTP = 2;        // OTLP over HTTP
}

message ObservabilityConfig {

  // Master enable switches
  bool metrics_enabled = 1;
  bool tracing_enabled = 2;
  bool logs_enabled = 3;

  // OTLP endpoint & transport selection
  string otlp_endpoint = 4;
  OtlpTransport transport = 5;

  // Whether to talk to the OTLP gRPC collector without TLS.
  //
  // Defaults to true, which is what the exporter has always done — it was
  // hardcoded and unreachable from configuration, so a collector serving TLS
  // could not be used at all. Collectors deployed as a sidecar or inside the
  // same network commonly serve plaintext, and pointing a TLS-by-default
  // exporter at one fails at startup with a "wrong version number" handshake
  // error that does not obviously name the cause.
  //
  // Set to false when the collector serves TLS. Ignored for the HTTP transport,
  // which takes its scheme from otlp_endpoint.
  //
  // Declared optional so absence is distinguishable from false: a bare proto3
  // bool defaults to false, which would silently switch every existing
  // deployment from plaintext to TLS on upgrade.
  optional bool otlp_insecure = 9;

  // Tracing configuration
  message TracingConfig {

    // Tracing sampling intent
    enum TraceHint {
      TRACE_HINT_UNSPECIFIED = 0;
      TRACE_HINT_DEFAULT = 1;
      TRACE_HINT_ALWAYS = 2;
      TRACE_HINT_NEVER = 3;
    }

    TraceHint trace_hint = 1;

    // Trace processing strategy
    enum TraceProcessorType {
      TRACE_PROCESSOR_UNSPECIFIED = 0;
      TRACE_PROCESSOR_SIMPLE = 1;
      TRACE_PROCESSOR_BATCH = 2;
    }

    TraceProcessorType processor = 2;

    // Batch trace processor tuning
    message BatchConfig {
      uint32 max_queue_size = 1;
      uint32 max_export_batch_size = 2;
      uint32 schedule_delay_ms = 3;
      uint32 export_timeout_ms = 4;
    }

    BatchConfig batch = 3;

    // Span granularity controls
    bool stage_spans_enabled = 4;
    bool queue_spans_enabled = 5;
    bool record_spans_enabled = 6;

    // Trace attribute verbosity
    enum AttributeLevel {
      ATTRIBUTES_UNSPECIFIED = 0;
      ATTRIBUTES_MINIMAL = 1;
      ATTRIBUTES_STANDARD = 2;
      ATTRIBUTES_VERBOSE = 3;
    }

    AttributeLevel attribute_level = 7;

    uint32 latency_budget_ms = 8;
  }

  TracingConfig tracing = 6;

  // Metrics configuration
  message MetricsConfig {

    // Instrument and cardinality controls for metrics emitted by this
    // runtime. Every one of them is ON when absent; set one to false to
    // turn it off.
    //
    // Declared optional so absence is distinguishable from false, for the
    // same reason as otlp_insecure above. These have always been intended
    // to default on — MetricsOptions in
    // internal/observability/metrics_options.hpp has initialised all of
    // them to true since it was introduced — but a bare proto3 bool reads
    // as false when unset, so every instrument was silently disabled for
    // any config that had not opted in field by field. Note that this
    // whole block is moot unless observability.metrics_enabled is true.
    optional bool request_metrics_enabled = 1;
    optional bool spill_metrics_enabled = 2;
    optional bool tier_occupancy_metrics_enabled = 3;
    // Per-ring slot gauges for TIER_RAM_RING. Cardinality is one series
    // per ring per gauge, and rings are named in static config, so this is
    // bounded by configuration rather than by traffic.
    optional bool ring_metrics_enabled = 10;

    // Cost / cardinality controls
    optional bool request_latency_histograms_enabled = 4;
    optional bool route_labels_enabled = 5;
    optional bool tier_labels_enabled = 6;

    // Collection / export timing hints
    uint32 min_collection_interval_ms = 7;
    uint32 collection_interval_ms = 8;
    uint32 export_timeout_ms = 9;
  }

  MetricsConfig metrics = 7;

  // Logging configuration
  message LoggingConfig {

    enum LogProcessorType {
      LOG_PROCESSOR_UNSPECIFIED = 0;
      LOG_PROCESSOR_SIMPLE = 1;
      LOG_PROCESSOR_BATCH = 2;
    }

    LogProcessorType processor = 1;

    message BatchConfig {
      uint32 max_queue_size = 1;
      uint32 max_export_batch_size = 2;
      uint32 schedule_delay_ms = 3;
      uint32 export_timeout_ms = 4;
    }

    BatchConfig batch = 2;
  }

  LoggingConfig logging = 8;
}