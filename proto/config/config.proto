syntax = "proto3";

package payload.runtime.config;

import "google/protobuf/duration.proto";
import "arrow/arrow_storage.proto";
import "config/observability.proto";
import "payload/manager/core/v1/ring_slot.proto";

/*
  Payload Manager Runtime Configuration

  This describes how a single node runs:
  storage tiers, database backend, worker behavior, etc.

  This file MUST NOT be used by clients.
*/

message ServerConfig {
  string bind_address = 1; // "0.0.0.0:50051"
}

// ------------------------------------------------------------------
// Database
// ------------------------------------------------------------------

message PostgresConfig {
  string connection_uri = 1;
  uint32 max_connections = 2;
}

message DatabaseConfig {
  oneof backend {
    PostgresConfig postgres = 1;
  }
}

// ------------------------------------------------------------------
// Storage tiers
// ------------------------------------------------------------------

message RamTierConfig {
  // Hard cap. Allocate fails with ResourceExhausted when an incoming request
  // would push the tier's live byte count above this. Set it to the actual
  // /dev/shm tmpfs size so the service rejects the request before the kernel
  // SIGBUSes a producer's first write into the mapping. 0 means no hard cap
  // (legacy; not recommended).
  uint64 capacity_bytes = 1;
  bool use_hugepages = 2;
  // Prefix for POSIX shm segment names (no leading slash required).
  // Segments are named /<shm_prefix>-<uuid>. Defaults to "pm".
  string shm_prefix = 3;
  // Percentage of capacity_bytes at which eviction starts firing (1-99).
  // Unset (0) means the default, 80. Below the threshold the tier never evicts
  // proactively; above it the tiering loop spills RAM payloads to disk until
  // usage drops back under. Lower values give more headroom against bursty
  // producers; higher values reduce eviction churn. Use 100 to evict only at
  // the hard cap (the behaviour before this field existed).
  uint32 eviction_high_water_pct = 4;
}

message DiskTierConfig {
  string root_path = 1;
  // Hard cap for the disk tier; see RamTierConfig.capacity_bytes for the
  // semantics. 0 means no hard cap.
  uint64 capacity_bytes = 2;
  bool fsync = 3;
  // Eviction high-water for the disk tier. Unset (0) means 80; 100 evicts
  // only at the hard cap. See RamTierConfig.eviction_high_water_pct.
  uint32 eviction_high_water_pct = 4;
}

message GpuDeviceConfig {
  uint32 device_id = 1;
  // Hard cap for this device; see RamTierConfig.capacity_bytes.
  uint64 capacity_bytes = 2;
  // Eviction high-water for the GPU tier. Unset (0) means 80; 100 evicts
  // only at the hard cap. See RamTierConfig.eviction_high_water_pct.
  uint32 eviction_high_water_pct = 3;
}

message GpuTierConfig {
  repeated GpuDeviceConfig devices = 1;
}

// One ring within the TIER_RAM_RING tier. The service pre-allocates n_slots
// POSIX shm regions of slot_size_bytes at startup and never frees them;
// producers and consumers work through PayloadRingService.
//
// Unlike the UUID-addressed RAM tier there is no per-capture allocation, so
// there is no allocation churn to leak. There is still reservation state to
// lose: a producer that dies between AcquireRingSlot and CommitRingSlot leaves
// its slot WRITING, and a consumer that dies holding a lease leaves the slot's
// refcount above zero. Neither is recoverable without the timeouts below, so
// both are reclaimed lazily when a ring runs out of slots. Slot names are
// deterministic and the writable open unlinks before creating, so a stale
// segment from a crashed process is replaced rather than accumulated — which
// also matters for correctness, since reusing a stale segment would inherit its
// old ftruncate size if slot_size_bytes changed between restarts.
message RingDefinition {
  // Operator-facing ring name, used as the ring_id in PayloadRingService RPCs
  // and embedded in RingSlotRef. Prefer a stable, descriptive name.
  string ring_id = 1;

  // Number of pre-allocated slots. Sized to absorb consumer jitter: the
  // producer can be up to (n_slots - 1) cycles ahead of the slowest consumer
  // before AcquireRingSlot starts hitting the exhaustion policy. 4-8 is a
  // reasonable default for steady-rate pipelines.
  uint32 n_slots = 2;

  // Per-slot capacity, sized to the largest payload the producer expects.
  uint64 slot_size_bytes = 3;

  // What happens when AcquireRingSlot finds every slot still leased.
  // NOTE: only DROP_NEW is implemented; BLOCK is accepted but behaves as
  // DROP_NEW. See internal/ring/ring.hpp.
  payload.manager.core.v1.RingExhaustionPolicy exhaustion_policy = 4;

  // POSIX shm name prefix. Slots are named /<shm_prefix>-ring-<ring_id>-slot<i>.
  // Defaults to RamTierConfig.shm_prefix when empty.
  string shm_prefix = 5;

  // How long a slot may sit in WRITING — acquired by a producer that has not
  // yet committed — before AcquireRingSlot is allowed to take it back. Guards
  // against a producer that crashed mid-capture; without it that slot is gone
  // for the life of the process.
  //
  // This is a crash safety net, not a scheduling parameter. Set it well above
  // the producer's worst-case time between acquire and commit: reclaiming a
  // slot from a producer that is merely slow lets the next producer write over
  // bytes it is still filling in. Reclaim only ever runs when the ring is
  // already exhausted, so a generous value costs nothing in the steady state.
  //
  // 0 selects the default of 30s. There is no way to disable reclaim, because
  // a permanently stuck slot is never the desired outcome.
  uint64 slot_write_timeout_ms = 6;

  // How long a consumer's read lease may be held before AcquireRingSlot is
  // allowed to drop it and reclaim the slot. Guards against a consumer that
  // died between LeaseRingSlot and ReleaseRingSlot.
  //
  // Same caveat as slot_write_timeout_ms, and more dangerous: force-releasing
  // a live consumer's lease lets the producer recycle a slot that consumer is
  // still reading. Set it above the slowest consumer's worst-case processing
  // time for one capture.
  //
  // 0 selects the default of 60s. Reclaim cannot be disabled.
  uint64 lease_ttl_ms = 7;
}

message RingTierConfig {
  repeated RingDefinition rings = 1;
}

message StorageConfig {
  RamTierConfig ram = 1;
  DiskTierConfig disk = 2;
  pb.arrow.storage.ObjectStorageConfig object = 3;
  GpuTierConfig gpu = 4;
  RingTierConfig ring = 5;
}

// ------------------------------------------------------------------
// Workers
// ------------------------------------------------------------------

message SpillWorkerConfig {
  uint32 threads = 1;
  google.protobuf.Duration retry_backoff = 2;
}

message LeaseConfig {
  google.protobuf.Duration default_lease = 1;
  google.protobuf.Duration max_lease = 2;
}

message LoggingConfig {
  string level = 1;
  string pattern = 2;
  bool include_trace_context = 3;
}

message StreamConfig {
  // Polling interval for the Subscribe long-poll loop when no new entries
  // are available. Lower values reduce tail latency at the cost of CPU.
  // Defaults to 50 ms when unset (zero).
  uint32 subscribe_poll_interval_ms = 1;
}

// ------------------------------------------------------------------
// Top-level
// ------------------------------------------------------------------

message RuntimeConfig {
  // Applied when a client allocates without stating a TTL.
  //
  // ttl_ms = 0 on the wire means "never expires", and it is also the default
  // value of the client's AllocateWritableBuffer parameter — so a producer that
  // simply does not think about expiry creates payloads that live forever.
  // Downstream, two of three producers took that default and accumulated blobs
  // until the tmpfs exhausted and the *next writer* took SIGBUS.
  //
  // Setting this gives such payloads a bounded lifetime without requiring every
  // producer to be fixed first. It never overrides an explicit ttl_ms, and it
  // never applies to no_evict / EVICTION_PRIORITY_NEVER payloads, which are
  // meant to be permanent.
  //
  // 0 (the default) preserves the original behaviour: no TTL is imposed.
  uint64 default_payload_ttl_ms = 9;

  ServerConfig server = 1;
  DatabaseConfig database = 2;
  StorageConfig storage = 3;
  SpillWorkerConfig spill_workers = 4;
  LeaseConfig leases = 5;
  LoggingConfig logging = 6;
  ObservabilityConfig observability = 7;
  StreamConfig stream = 8;
}
